<section
  id="resignation-queue"
  class="notification-view resignation-queue-view"
  data-resignation-queue
  hidden
>
  <div class="page-section-header">
    <div>
      <p class="dashboard-kicker">HR Services</p>
      <p>Review Resignation Forms Submitted by Employees.</p>
    </div>
  </div>
  <div class="resignation-queue-layout">
    <section class="notification-panel">
      <div class="panel-header">
        <h2>Pending Resignations</h2>
        <span class="notification-total" data-resignation-pending-count></span>
      </div>
      <div class="resignation-queue-list" data-resignation-pending></div>
    </section>
    <section class="notification-panel">
      <div class="panel-header">
        <h2>Reviewed Resignations</h2>
        <span class="notification-total" data-resignation-reviewed-count></span>
      </div>
      <div class="resignation-queue-list" data-resignation-reviewed></div>
    </section>
  </div>
</section>
