<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mamily-Connect</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="hero-panel">
        <div class="topbar">
          <div class="brand" aria-label="Mamily">
            <img src="logo.png" alt="Mamily logo" class="brand-logo" />
          </div>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">HR MANAGEMENT SYSTEM</p>
          <h1>Managing the Mamily Workspace Smarter</h1>
          <p class="subtitle">
            A centralized system for the Mamily workforce to stay connected to
            each other at all times.
          </p>
        </div>

        <div class="illustration-panel">
          <div class="figure-card">
            <img src="pregnantwoman.png" alt="Pregnant employee illustration" />
          </div>
        </div>
      </aside>

      <main class="auth-panel">
        <div class="auth-inner">
          <div class="auth-head">
            <span class="welcome">Welcome</span>
            <h2>Employee Sign in</h2>
            <p>Sign in to access your employee dashboard</p>
          </div>

          <div class="role-selector" aria-label="Login type selector">
            <button
              type="button"
              class="role-option active"
              data-role="employee"
            >
              <span class="role-icon employee-icon">E</span>
              <span class="role-info">
                <strong>Employee</strong>
                <small>Employee Portal</small>
              </span>
              <span class="role-check">✓</span>
            </button>

            <button type="button" class="role-option" data-role="manager">
              <span class="role-icon manager-icon">H</span>
              <span class="role-info">
                <strong>HR / Manager</strong>
                <small>Manager Portal</small>
              </span>
              <span class="role-check">✓</span>
            </button>
          </div>

          <form class="login-form">
            <div class="form-group">
              <label for="email">Employee Email</label>
              <div class="input-wrapper">
                <span class="input-icon">@</span>
                <input
                  type="email"
                  id="email"
                  placeholder="Enter your email id"
                  autocomplete="email"
                />
              </div>
            </div>

            <div class="form-group">
              <div class="password-label">
                <label for="password">Password</label>
                <a href="#">Forgot Password</a>
              </div>
              <div class="input-wrapper">
                <span class="input-icon lock">•</span>
                <input
                  type="password"
                  id="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
            </div>

            <label class="remember-option">
              <input type="checkbox" checked />
              <span class="custom-checkbox"></span>
              <span>Remember Me</span>
            </label>

            <button type="submit" class="login-button">
              <span>Sign in as an Employee</span>
              <span class="button-arrow">→</span>
            </button>
          </form>

          <p class="login-footer">
            Need help with signing up? <a href="#">Contact HR Support</a>
          </p>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
